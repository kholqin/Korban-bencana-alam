    setTimeout(()=>{
      darkWordVisible=false;
      app.classList.add('dark-mode');
      updateUI();
    }, 1800);

    // Floating texts
    const texts=[];
    for(let i=0;i<8+stage*4;i++){
      texts.push({
        id:i, text:FLOATING_TEXTS[i%FLOATING_TEXTS.length],
        x:2+Math.random()*76, y:2+Math.random()*76,
        size:14+Math.random()*30, speed:.5+Math.random()*2
      });
    }
    floatingTexts=texts;
    if(floatInterval) clearInterval(floatInterval);
    floatInterval=setInterval(()=>{
      floatingTexts=floatingTexts.map(t=>({
        ...t,
        x:Math.max(1,Math.min(89,t.x+(Math.random()-.5)*t.speed*3)),
        y:Math.max(1,Math.min(89,t.y+(Math.random()-.5)*t.speed*3))
      }));
      updateUI();
    },80);

    startLagGenerator(stage);

    // Block right-click
    window.addEventListener('contextmenu',(e)=>{e.preventDefault();return false});

    // Keyboard block
    window.addEventListener('keydown',blockKeys);
  }
}
window.handleTrigger = handleTrigger;

// Block keys
function blockKeys(e){
  if(e.ctrlKey||e.altKey||e.metaKey){e.preventDefault();return false}
}

// ===== FRAME DROP COUNTER =====
let frameDropCount = 0;
setInterval(()=>{
  if(stage>0){
    frameDropCount+=Math.floor(Math.random()*40+10);
    document.getElementById('lagCounter').textContent=`⚡ FRAMES DROPPED: ${frameDropCount} | CPU: ${Math.min(100,40+stage*20)}% | GPU: 🔥 BERAT`;
  }
},500);

// ===== UPDATE UI =====
function updateUI(){
  app.className=`app stage-${stage}`;
  keyCounter.textContent=`SPASI ${count}/3`;

  if(stage===0){
    stageInd.innerHTML=`<span class="safe">● SAFE</span>`;
    lagCounter.style.display='none';
  } else if(stage===1){
    stageInd.innerHTML=`<span class="warn">⚠ STAGE 1 — AWAS! HP MULAI PANAS</span>`;
    lagCounter.style.display='block';
  } else if(stage===2){
    stageInd.innerHTML=`<span class="danger">🔥 STAGE 2 — BRUTAL! DELAY & LAG!</span>`;
  } else {
    stageInd.innerHTML=`<span class="critical">💀 STAGE 3 — MAX! SYSTEM BREACHED!</span>`;
  }

  renderOverlay();
}

// ===== RENDER OVERLAY =====
function renderOverlay(){
  let overlay = document.getElementById('hackerOverlay');
  if(stage===0){
    if(overlay) overlay.remove();
    return;
  }

  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='hackerOverlay';
    overlay.className='hacker-overlay';
    document.body.appendChild(overlay);
  }

  overlay.innerHTML = '';

  // Matrix rain
  const matrixDiv = document.createElement('div');
  matrixDiv.className='matrix-rain';
  matrixColumns.forEach((col,i)=>{
    const span=document.createElement('span');
    span.textContent=col;
    span.style.cssText=`--delay:${(i%14)*-.2}s;--duration:${1.5+(i%3)}s;animation-delay:${(i%14)*-.2}s;animation-duration:${1.5+(i%3)}s;opacity:${stage>=2?.95:.4}`;
    matrixDiv.appendChild(span);
  });
  overlay.appendChild(matrixDiv);

  // Grid
  const grid=document.createElement('div');
  grid.className=`hacker-grid stage-${stage}`;
  const panelCount=stage===3?30:stage===2?18:10;
  const labels=['ACCESS','TRACE','EXEC','BREACH','SCAN','ROOT','DUMP','MASK','PWN','ZOMBIE','CRYPTO','KILL','WORM','DDoS','PROXY','SHELL','BRUTE','PHISH','SPOOF','SNIFF','INJECT','SPRAY','FLOOD','BURN','CPU:100%','GPU:BURN','FAN:MAX','TEMP:89C','VOLT:SPIKE','CLOCK:OC'];
  const codes=['0101 1100 0011','PACKET_STREAM','NUSANTARA_01','MASK: ACTIVE','SHELL: OPEN','PORT: 4444','CRED: DUMP','ROOT: TRUE','PAYLOAD: SENT','PROXY: CHAIN','BOT: ONLINE','BACKDOOR: OPEN','MEMORY: LEAK','PROC: INJECT','NET: FLOOD','KEYLOG: ON','CPU: 100%','GPU: BURN','FAN: MAX','TEMP: 89C','VOLT: SPIKE','CLOCK: OC','THERMAL: THROT','FIRE: RISK'];
  for(let i=0;i<panelCount;i++){
    const panel=document.createElement('div');
    panel.className='hacker-panel';
    panel.innerHTML=`
      <div class="panel-head"><span>NODE_${String(i+1).padStart(2,'0')}</span><i>● LIVE</i></div>
      <div class="fake-video">
        <div class="scanline" style="animation-duration:${.1+Math.random()*.2}s"></div>
        <div class="terminal-art">${labels[i%labels.length]}<br><b>${codes[i%codes.length]}</b></div>
        <div class="progress"><span style="width:${5+(i*4)%90}%;animation-duration:${.1+Math.random()*.2}s"></span></div>
      </div>
    `;
    panel.style.animationDuration=`${.08+Math.random()*.2}s`;
    panel.style.animationDelay=`${i*.03}s`;
    grid.appendChild(panel);
  }
  overlay.appendChild(grid);

  // Photo rain
  const photoRain=document.createElement('div');
  photoRain.className='photo-rain';
  const photoCount=stage===3?28:16;
  for(let i=0;i<photoCount;i++){
    const img=document.createElement('img');
    img.src='https://kholqin.github.io/aman-kaget/media/amanonymous.jpg';
    img.alt='';
    img.style.cssText=`--i:${i};width:${40+Math.random()*120}px;animation-duration:${.3+Math.random()*.5}s;animation-delay:${i*-.05}s`;
    photoRain.appendChild(img);
  }
  overlay.appendChild(photoRain);

  // Dark word
  if(darkWordVisible){
    const dw=document.createElement('div');
    dw.className='dark-word';
    dw.textContent='⚫ dark ⚫';
    overlay.appendChild(dw);
  }

  // Floating texts
  floatingTexts.forEach(ft=>{
    const el=document.createElement('div');
    el.className='floating-hack-text';
    el.textContent=ft.text;
    el.style.cssText=`
      left:${ft.x}%;top:${ft.y}%;
      font-size:${ft.size}px;
      color:${stage===3?'#ff0040':`hsl(${Math.random()*360},100%,50%)`};
      text-shadow:${stage===3?'0 0 5px #ff0040, 0 0 15px #ff0040, 0 0 40px #ff0040':'0 0 5px #00ff41, 0 0 15px #00ff41, 0 0 40px #00ff41'};
      animation-duration:${.2+Math.random()*.3}s;
    `;
    overlay.appendChild(el);
  });

  // Center panel
  const center=document.createElement('div');
  center.className='hacker-center';
  const msg=stage===1?'⚠ PERINGATAN — SUHU MULAI NAIK':stage===2?'🔥 KRITIS — HP PANAS & DELAY PARAH':'💀 TOTAL BREACH — KAMU TIDAK BISA APA-APA';
  const desc=stage===1?'⚠ Suhu naik. Sistem anomali. Video berjalan di background...':stage===2?'🔥🔥🔥 GPU/CPU 100%! Delay brutal! HP lo makin panas! MAZKiPLAY!':'💀💀💀 LO KAGA BISA APA-APA! MAZKiPLAY HACKED TOTAL! HP LO MELEDUK!';
  center.innerHTML=`
    <div class="center-kicker">${msg}</div>
    <h2>ACCESS <em style="color:${stage===3?'#ff0040':'#e44536'}">THE VOID</em></h2>
    <p>${desc}</p>
    <div class="center-actions">
      <div class="redirect-notice">⏳ Redirect otomatis dalam ${secondsLeft} detik</div>
      <button class="primary small" onclick="resetAll()" style="background:${stage===3?'#ff0040':'#dcf77d'};color:${stage===3?'#fff':'#122015'}">🛑 BERHENTI (KALAU BISA)</button>
    </div>
  `;
  overlay.appendChild(center);
}

// ===== RESET =====
function resetAll(){
  stage=0;count=0;darkWordVisible=false;droneStarted=false;frameDropCount=0;
  floatingTexts=[];secondsLeft=60;countdownEl.textContent=60;

  if(floatInterval) clearInterval(floatInterval);
  if(lagInterval) clearInterval(lagInterval);
  if(cleanupVideo) cleanupVideo();
  if(cleanupWebGL) cleanupWebGL();
  workers.forEach(w=>w.terminate());
  workers=[];

  const music=document.getElementById('audioMusic'); music.pause(); music.src='';
  const laugh=document.getElementById('audioLaugh'); laugh.pause(); laugh.src='';
  if(videoEl){videoEl.pause();videoEl.srcObject=null;}
  window.onbeforeunload=null;
  app.classList.remove('dark-mode');
  document.getElementById('redirectBanner').classList.remove('urgent');

  const overlay=document.getElementById('hackerOverlay');
  if(overlay) overlay.remove();

  updateUI();
}
window.resetAll = resetAll;

// ===== KEYBOARD =====
document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){
    e.preventDefault();
    handleTrigger();
  }
});

// Initial render
updateUI();
</script>
</body>
</html>
